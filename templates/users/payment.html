<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay Online | EventHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3>Pay for {{ event.name }}</h3>
                </div>
                <div class="card-body">
                    <p><strong>Location:</strong> {{ event.location }}</p>
                    <p><strong>Event Date:</strong> {{ event_date }}</p>
                    <p><strong>People:</strong> {{ people }}</p>
                    <p><strong>Contact:</strong> {{ contact }}</p>
                    <p><strong>Amount:</strong> Rs. {{ amount / 100 }}</p>

                    <button class="btn btn-success" id="pay-btn">Pay Now</button>
                    <a href="/book/{{ event.id }}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
    var options = {
        key: "{{ razorpay_key }}",
        amount: "{{ amount }}",
        currency: "INR",
        name: "EventHub",
        description: "Booking payment",
        order_id: "{{ order.id }}",
        handler: function (response) {
            var params = new URLSearchParams({
                event_date: "{{ event_date }}",
                people: "{{ people }}",
                contact: "{{ contact }}"
            });

            window.location.href = "/payment-success/{{ event.id }}?" + params.toString();
        },
        prefill: {
            name: "{{ session.username }}",
            email: "",
            contact: "{{ contact }}"
        },
        theme: {
            color: "#3399cc"
        }
    };

    document.getElementById("pay-btn").onclick = function(e) {
        e.preventDefault();
        var rzp1 = new Razorpay(options);
        rzp1.open();
    };
</script>
</body>
</html>
